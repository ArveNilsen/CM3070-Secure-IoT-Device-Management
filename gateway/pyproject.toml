[project]
name = "gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=47.0.0",
    "fastapi[standard]>=0.124.4",
    "mqtt>=0.0.1",
    "paho-mqtt>=2.1.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.113.0",
    "pytest>=8.3.5",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".venv", "__pycache__", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade (modernize syntax for 3.10+)
]
ignore = [
    "E501", # line too long (formatter handles this)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.deptry.per_rule_ignores]
DEP004 = ["ngrok"]

[tool.ruff.format]
quote-style = "double"
